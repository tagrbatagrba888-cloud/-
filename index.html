const lineKey = l => `${l.productId}|${l.color || ''}|${l.size || ''}`;
function cartCalc() {
  const lines = [];
  S.cart.forEach(l => {
    const p = S.byId.get(l.productId); if (!p) return;
    const v = variantFor(p, l.color, l.size), max = maxQty(p, v), unit = unitPrice(p, v), qty = Math.max(0, Math.min(l.qty, max));
    lines.push({ ...l, p, v, unit, max, qty, gone: qty <= 0, total: r2(unit * qty), key: lineKey(l) });
  });
  const live = lines.filter(l => !l.gone), subtotal = r2(live.reduce((s, l) => s + l.total, 0));
  let discount = 0, coupon = null, couponMsg = '', couponOk = false;
  if (S.couponCode) {
    coupon = S.coupons.find(c => c.code === S.couponCode);
    if (!coupon) couponMsg = 'كود غير صحيح';
    else {
      couponMsg = couponProblem(coupon);
      if (!couponMsg) {
        const el = coupon.productId ? live.filter(l => l.productId === coupon.productId) : live;
        const base = r2(el.reduce((s, l) => s + l.total, 0)), q = el.reduce((s, l) => s + l.qty, 0);
        if (coupon.productId && !el.length) couponMsg = `هذا الكود خاص بمنتج «${coupon.productName || 'محدد'}» وغير موجود في سلتك`;
        else if (coupon.minOrder && subtotal < coupon.minOrder) couponMsg = `الحد الأدنى للطلب ${money(coupon.minOrder)}`;
        else if (coupon.minQty && q < coupon.minQty) couponMsg = `الحد الأدنى للكمية ${coupon.minQty}`;
        else { let d = coupon.type === 'percent' ? base * coupon.value / 100 : coupon.value; if (coupon.maxDiscount) d = Math.min(d, coupon.maxDiscount); discount = r2(Math.min(Math.max(d, 0), base)); couponOk = true; }
      }
    }
  }
  const net = r2(subtotal - discount), shipping = live.length === 0 ? 0 : (S.cfg.freeOver > 0 && net >= S.cfg.freeOver ? 0 : S.cfg.ship);
  return { lines, live, subtotal, discount, coupon, couponMsg, couponOk, net, shipping, total: r2(net + shipping), count: live.reduce((s, l) => s + l.qty, 0) };
}

async function restoreStock(pid, ls) {

      toast(reg ? '✓ تم إنشاء حسابك' : '✓ تم تسجيل الدخول');
      const after = acctAfterLogin; closeAccount(); if (after) { cartStep = 'checkout'; setTimeout(() => { drawCart(); openDrawer('cartDrawer'); }, 250); }
    } catch (err) { $('#authErr').textContent = authMsg(err); btn.disabled = false; }
    return;
  }
  if (f === 'profForm') {
    const d = { name: $('#prName').value.trim(), phone: $('#prPhone').value.replace(/\D/g, ''), city: $('#prCity').value.trim(), address: $('#prAddr').value.trim() };
    try { await setDoc(doc(db, 'customers', S.user.uid), { uid: S.user.uid, email: S.user.email || '', ...d }, { merge: true }); S.profile = { ...(S.profile || {}), ...d }; $('#acctLabel').textContent = (d.name || 'حسابي').split(' ')[0]; toast('✓ تم حفظ بياناتك'); } catch (_) { toast('تعذّر الحفظ', true); }
    return;
  }
  if (f === 'rvForm' && PV) {
    if (!S.user) return needLogin('سجّل الدخول لتكتب تقييمك');
    const text = $('#rvText').value.trim(), title = $('#rvTitle').value.trim(), name = (S.profile?.name || S.user.displayName || 'عميل').trim();
    $('#fgR').classList.toggle('err', !PV.stars); $('#fgT').classList.toggle('err', text.length < 10); if (!PV.stars || text.length < 10) return;
    const btn = $('#rvBtn'); btn.disabled = true;
    try {
      if (!S.ordersLoaded) await loadMyOrders();
      const verified = S.myOrders.some(o => !['cancelled', 'refunded'].includes(o.status) && (o.items || []).some(i => i.productId === PV.p.id));
      const data = { productId: PV.p.id, productName: PV.p.name, uid: S.user.uid, name, rating: PV.stars, title, text, verified, helpful: 0, hidden: false, createdAt: serverTimestamp() };
      const ref = await addDoc(collection(db, 'reviews'), data); S.reviews.push(normReview({ id: ref.id, ...data, createdAt: new Date() })); indexReviews(); PV.stars = 0; toast('✓ شكرًا! تم نشر تقييمك'); drawProduct(); PV.tab = 'rev'; $$('#dtabs button').forEach(x => x.classList.toggle('on', x.dataset.id === 'rev')); drawTab(); renderGrid();
    } catch (err) { console.error(err); toast('تعذّر نشر التقييم', true); btn.disabled = false; }
    return;
  }
  if (f === 'qForm' && PV) {
    if (!S.user) return needLogin('سجّل الدخول لتطرح سؤالًا');
    const q = $('#qText').value.trim(); if (q.length < 5) return toast('اكتب سؤالك (5 أحرف على الأقل)', true);
    try { const data = { productId: PV.p.id, productName: PV.p.name, uid: S.user.uid, name: S.profile?.name || S.user.displayName || 'عميل', q, a: '', hidden: false, createdAt: serverTimestamp() }; const ref = await addDoc(collection(db, 'questions'), data); S.questions.push({ id: ref.id, ...data, date: Date.now() }); toast('✓ وصل سؤالك وسيجيب عليه المتجر'); drawQA(); } catch (_) { toast('تعذّر إرسال السؤال', true); }
  }
});
function showWishlist() {
  $('#wishItems').innerHTML = S.wish.size ? [...S.wish].map(id => S.byId.get(id)).filter(Boolean).map(p => `<div class="cartitem"><div class="ci" style="cursor:pointer" data-act="open" data-id="${esc(p.id)}">${imgTag(p.images[0], p.name)}</div><div><b>${esc(p.name)}</b><small>${money(p.price)}</small><button type="button" class="textlink" style="margin-top:9px" data-act="add" data-id="${esc(p.id)}">${needsOptions(p) ? 'اختر الخيارات' : 'أضف للسلة'}</button></div><button type="button" class="close" data-act="wish" data-id="${esc(p.id)}" aria-label="إزالة">×</button></div>`).join('') : '<div class="empty">لم تضف منتجات للمفضلة بعد.</div>';
  hydrate($('#wishItems')); openDrawer('wishDrawer');
}
window.addEventListener('storage', e => { if (e.key === 'weshah_cart') { S.cart = lsGet('weshah_cart', []); updateCounts(); } });
function routeHash() { const m = location.hash.match(/^#\/product\/(.+)$/); if (m && S.loaded) { const id = decodeURIComponent(m[1]); if (!PV || PV.p.id !== id) openProduct(id, true); } }
window.addEventListener('hashchange', routeHash);

/* ================= التحميل ================= */
function setProducts(raw) {
  S.products = raw.filter(d => !['draft', 'archived'].includes(d.status)).map(d => normProduct(d, d.id)); S.byId = new Map(S.products.map(p => [p.id, p]));
  S.cart = S.cart.filter(l => S.byId.has(l.productId)); S.wish = new Set([...S.wish].filter(id => S.byId.has(id)));
}
async function refreshProducts() { try { const snap = await getDocs(collection(db, 'products')); setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))); if (S.loaded) { renderGrid(); updateCounts(); } } catch (_) {} }
async function init() {
  const [p, r, c, cfg] = await Promise.allSettled([getDocs(collection(db, 'products')), getDocs(collection(db, 'reviews')), getDocs(collection(db, 'coupons')), getDoc(doc(db, 'settings', 'site'))]);
  if (p.status === 'fulfilled') setProducts(p.value.docs.map(d => ({ id: d.id, ...d.data() })));
  if (r.status === 'fulfilled') { S.reviews = r.value.docs.map(d => normReview({ id: d.id, ...d.data() })).filter(x => !x.hidden); indexReviews(); }
  if (c.status === 'fulfilled') S.coupons = c.value.docs.map(d => normCoupon({ id: d.id, ...d.data() })).filter(x => x.code);
  if (cfg.status === 'fulfilled' && cfg.value.exists()) {
    const d = cfg.value.data(), sf = d.storefront || {};
    Object.assign(S.cfg, { siteNameEn: d.siteNameEn || 'WESHAH', siteNameAr: d.siteNameAr || '', logoImageId: d.logoImageId || '', logoUrl: d.logoUrl || '', currency: (d.accounting && d.accounting.currency) || 'ج.م',
      ship: sf.shippingFee !== undefined && sf.shippingFee !== '' ? num(sf.shippingFee) : 50, freeOver: sf.freeShippingOver !== undefined && sf.freeShippingOver !== '' ? num(sf.freeShippingOver) : 1000,
      phone: sf.phone || '', announcement: sf.announcement || '', tagline: sf.tagline || '', about: sf.about || '', email: sf.email || '', returnPolicy: sf.returnPolicy || '' });
  }
  S.loaded = true; paintBrand();
  if (p.status === 'rejected') { $('#main').innerHTML = '<div class="wrap"><div class="empty">تعذّر تحميل المنتجات — تحقق من الاتصال أو من قواعد Firestore.</div></div>'; renderFooter(); return; }
  renderNav(); renderHome(); renderFooter(); updateCounts(); routeHash();
}
notificationControls=mountNotifications({auth,openAccount,toast});
mountSupport({auth,openAccount,getProducts:()=>S.products});
init();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
